[package]
name = "color-picker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # minimum required by eframe 0.37
description = "Lightweight desktop color picker: pick colors from the screen or an image."
repository = "https://github.com/aIeics/color-picker"
publish = false

# Keep this list short: every crate needs a reason, with default features off.
[dependencies]
# GUI. Default features off: OpenGL (glow) instead of wgpu, built-in fonts only.
# x11/wayland only matter on Linux and add nothing to a Windows build.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Opening images to pick colors from. Default features off: PNG and JPEG only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Windows only: reading screen pixels (GDI) and the cursor position.
# eframe already builds this crate, so it adds little to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# Small, fast release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
